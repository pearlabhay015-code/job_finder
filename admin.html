<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helping Hands CMS</title>
<style>body{font:16px Inter,Arial,sans-serif;margin:0;background:#f4f8fb;color:#152238}main{max-width:1050px;margin:48px auto;padding:0 20px}section{background:#fff;border:1px solid #d7e4ec;border-radius:18px;padding:24px;margin:18px 0}h1,h2{font-weight:600}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 14px;border:1px solid #bed3e0;border-radius:8px;font:inherit}textarea{min-height:100px}button{background:#2589dc;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer}.danger{background:#b24141}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hidden{display:none}.job{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #e5edf3}.message{padding:12px;border-radius:8px;background:#e8f5ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>Helping Hands CMS</h1><p>Manage public content, jobs, applications, resumes, and payment settings without editing website code.</p><section id="login"><h2>Admin sign in</h2><input id="password" type="password" placeholder="password"><button onclick="login()">Sign in</button><p id="login-message"></p></section>
<div id="cms" class="hidden"><section><h2>Website settings</h2><div class="grid"><label>Brand name<input id="brandName"></label><label>Job posting fee (INR)<input id="jobPostingFee" type="number"></label></div><label>Hero title<input id="heroTitle"></label><label>Hero subtitle<input id="heroSubtitle"></label><label>Hero description<textarea id="heroDescription"></textarea></label><button onclick="saveSettings()">Save settings</button></section>
<section><h2>Add a job</h2><div class="grid"><label>Job title<input id="title"></label><label>Organization<input id="organization"></label><label>Location<input id="location"></label><label>Sector<input id="sector"></label><label>Type<select id="type"><option value="standard">Standard</option><option value="premium">Value member</option><option value="rfp">RFP / Tender</option></select></label><label>Experience<input id="experience"></label></div><label>Deadline<input id="deadline" placeholder="e.g. 12 Days Left"></label><label>Description<textarea id="description"></textarea></label><button onclick="addJob()">Publish job</button></section>
<section><h2>Jobs</h2><div id="jobs"></div></section><section><h2>Applicants and resumes</h2><div id="applications"></div></section></div><p id="message"></p>
<script>let token='',data={};const api=(url,opts={})=>fetch(url,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}}).then(async r=>{const v=await r.json().catch(()=>({}));if(!r.ok)throw Error(v.error||'Request failed');return v});function note(t){document.querySelector('#message').textContent=t}async function login(){try{const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});token=r.token;document.getElementById('login').classList.add('hidden');document.getElementById('cms').classList.remove('hidden');await load()}catch(e){document.querySelector('#login-message').textContent=e.message}}async function load(){data=await api('/api/admin/data');for(const k of ['brandName','jobPostingFee','heroTitle','heroSubtitle','heroDescription'])document.getElementById(k).value=data.settings[k]||'';document.getElementById('jobs').innerHTML=data.jobs.map(j=>`<div class="job"><span><b>${j.title}</b><br>${j.organization} · ${j.location} · ${j.status}</span><button class="danger" onclick="removeJob('${j.id}')">Delete</button></div>`).join('')||'No jobs yet.';document.getElementById('applications').innerHTML=[...data.applications,...data.resumes].map(a=>`<div class="job"><span><b>${a.name||'Resume submission'}</b><br>${a.email||''} · ${a.resume?.originalName||''}</span></div>`).join('')||'No applicants or resumes yet.'}async function saveSettings(){const settings=Object.fromEntries(['brandName','jobPostingFee','heroTitle','heroSubtitle','heroDescription'].map(k=>[k,document.getElementById(k).value]));await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(settings)});note('Settings saved.')}async function addJob(){try{const job=Object.fromEntries(['title','organization','location','sector','type','experience','deadline','description'].map(k=>[k,document.getElementById(k).value]));await api('/api/admin/jobs',{method:'POST',body:JSON.stringify(job)});note('Job published.');await load()}catch(e){note(e.message)}}async function removeJob(id){if(confirm('Delete this job?')){await api('/api/admin/jobs/'+id,{method:'DELETE'});await load()}}</script></main></body></html>
